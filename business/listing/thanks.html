<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お申し込みありがとうございます | Terroir HUB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@300;400;500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAFAF7;--surface:#F3F0EA;--border:rgba(0,0,0,.09);--text:#1a1816;--muted:rgba(26,24,22,.62);--gold:#996E1A;--fd:'Shippori Mincho',serif;--fb:'Noto Sans JP',sans-serif;--fn:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--fb);line-height:1.95;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:clamp(1.4rem,5vw,3rem)}
a{color:var(--gold)}
.sheet{max-width:620px;background:#fff;border:1px solid var(--border);padding:clamp(1.8rem,4vw,3rem)}
.brand{font-family:var(--fd);font-size:1.1rem;font-weight:700;letter-spacing:.06em;padding-bottom:1rem;border-bottom:1px solid var(--border);margin-bottom:1.8rem}
h1{font-family:var(--fd);font-size:clamp(1.4rem,3.4vw,1.9rem);font-weight:700;line-height:1.45;margin-bottom:1rem}
p{font-size:.94rem;margin-bottom:1rem}
ol{margin:0 0 1.2rem 1.2rem;font-size:.92rem}
li{margin-bottom:.5rem}
.note{background:var(--surface);border:1px solid var(--border);padding:1rem 1.2rem;font-size:.84rem;color:var(--muted);line-height:1.9}
.back{display:inline-block;margin-top:1.4rem;font-family:var(--fn);font-size:.78rem;font-weight:600;letter-spacing:.1em;color:#fff;background:var(--gold);padding:.75rem 1.6rem;text-decoration:none}
</style>
</head>
<body>
<div class="sheet">
  <div class="brand">Terroir HUB</div>
  <h1>お申し込みありがとうございます。</h1>
  <p>ご登録のメールアドレスに、Stripe から領収書をお送りしています。</p>
  <p>このあとの流れです。</p>
  <ol>
    <li>3営業日以内に、担当より掲載内容の確認のご連絡を差し上げます。</li>
    <li>掲載情報の修正点・ご提供いただける写真があれば、その際にお知らせください。</li>
    <li>翌月以降、毎月はじめに月次レポートをお送りします。</li>
  </ol>
  <div class="note">
    <p>計測の都合上、初回のレポートには数値が入らない場合があります。その場合はその旨を明記してお送りします。</p>
    <p>ご不明な点は contact@fomus.jp までご連絡ください。</p>
  </div>
  <a class="back" href="/">Terroir HUB へ戻る</a>
</div>
</body>
</html>
